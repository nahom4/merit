name: nightly

# Contract tests call live third-party APIs and evals run against the real corpus. Neither
# belongs on the PR path: an IRS outage must not block a merge (docs/testing.md).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Contract tests pull live announcement PDFs, which means the real extractor runs here too.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract
      - name: Open an issue when a source changed under us
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Contract test failure on ${new Date().toISOString().slice(0, 10)}`,
              body: `A third-party schema we parse has changed. Run \`pnpm test:contract\` locally.\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['contract', 'upstream-change'],
            });

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
